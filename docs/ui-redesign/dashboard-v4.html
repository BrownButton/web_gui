<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FanCM — Dashboard v4 (ref 스타일)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap">
<style>
/* =====================================================================
   0. Tokens — ref 의 언어: 단색(오프화이트 · 검정) + 흐린 사진 위 글래스 하나.
   숫자는 가는 기하학 산세리프(Outfit), 한글은 Pretendard.
   ===================================================================== */
:root{
  --bg:#f1f0ee;--tile:#ffffff;--tile-2:#f6f5f3;--ink:#121212;--ink-2:#55555a;--ink-3:#8c8c91;--line:rgba(18,18,18,.14);--line-2:rgba(18,18,18,.08);
  --dark:#141415;--dark-2:#1c1c1e;--dark-line:rgba(255,255,255,.1);--dark-ink:#f2f2f2;--dark-ink-2:#9a9aa0;
  --ok:#2fa565;--warn:#e09a2a;--err:#e14b3b;--accent:#f0a24a;
  --font:'Outfit','Pretendard Variable',Pretendard,-apple-system,'Segoe UI',sans-serif;
  --r:44px;--r-sm:26px;--r-xl:54px;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e0f;--tile:#1a1a1c;--tile-2:#222225;--ink:#f2f2f2;--ink-2:#b4b4b9;--ink-3:#7c7c82;--line:rgba(255,255,255,.14);--line-2:rgba(255,255,255,.07);
}}
:root[data-theme="dark"]{
  --bg:#0e0e0f;--tile:#1a1a1c;--tile-2:#222225;--ink:#f2f2f2;--ink-2:#b4b4b9;--ink-3:#7c7c82;--line:rgba(255,255,255,.14);--line-2:rgba(255,255,255,.07);
}

/* =====================================================================
   1. Base
   ===================================================================== */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.005em;overflow-x:hidden}
button,input{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
[hidden]{display:none!important}
html.theming *{transition:background-color .3s ease,color .3s ease,border-color .3s ease}

/* 바탕의 흐린 색 덩어리 — ref 의 사진 블러를 CSS 로 */
.blobs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.blobs .a{width:620px;height:520px;right:-120px;top:-80px;background:radial-gradient(circle at 40% 40%,#f3b267,#e8853a 55%,transparent 72%)}
.blobs .b{width:520px;height:460px;right:220px;top:360px;background:radial-gradient(circle at 50% 50%,#6f93c9,#3d5f94 55%,transparent 72%);opacity:.38}
.blobs .c{width:420px;height:420px;left:-140px;top:520px;background:radial-gradient(circle at 50% 50%,#e7d7c3,transparent 70%);opacity:.6}
:root[data-theme="dark"] .blobs i,:root:not([data-theme="light"]) .blobs i{opacity:.28}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .blobs .a{opacity:.55}:root:not([data-theme="dark"]) .blobs .b{opacity:.38}}

/* 누를 수 있는 것은 눌린다 */
.press{transition:transform 160ms var(--ease-out),background 150ms ease,color 150ms ease,border-color 150ms ease}
.press:active{transform:scale(.96);transition-duration:60ms}

/* =====================================================================
   2. Top — 원형 버튼 + 로고, 테두리 알약 내비
   ===================================================================== */
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.top{height:88px;display:flex;align-items:center;gap:10px}
.circ{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);background:transparent}
.circ.fill{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;margin-right:24px}
.pills{display:flex;gap:8px;margin-left:auto}
.pill{height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:400;color:var(--ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:transparent}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.sm{height:34px;padding:0 14px;font-size:12.5px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
@media (hover:hover) and (pointer:fine){.pill:not(.on):hover{background:var(--line-2)}}

/* =====================================================================
   3. Hero — 제목 + 큰 숫자 + 호 게이지 | 글래스 타일(그룹 지령)
   ===================================================================== */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;margin-top:8px;align-items:start}
.hero-l{display:flex;flex-direction:column;gap:18px}
.title{font-size:48px;font-weight:300;line-height:1.05;letter-spacing:-.02em}
.title b{font-weight:400}
.tabs{display:flex;gap:8px}
.score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-top:8px}
.score .lbl{font-size:13px;color:var(--ink-3)}
.score .lbl b{font-weight:400;color:var(--ink-2)}
.score .big{font-size:112px;font-weight:300;line-height:.95;letter-spacing:-.05em;margin-top:2px}
.score .cap{font-size:13px;color:var(--ink-3);line-height:1.35;margin-top:10px}
.score .cap b{color:var(--ink);font-weight:400;display:block;font-size:14px}
.gauge{width:220px;height:140px;justify-self:end}
.gauge path{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.25}
.gauge .arc2{opacity:.9;stroke-width:1.6}
.gauge .needle{stroke:var(--ink);stroke-width:1.4;opacity:.9;transform-origin:110px 120px;transition:transform 320ms linear}
.gauge .pin{fill:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hero-r{display:flex;flex-direction:column;gap:16px}

/* =====================================================================
   4. Tile — ref 의 고정 구조: 원형 아이콘 · 두 줄 제목 · 화살표 · 큰 숫자 · 글리프
   ===================================================================== */
/* 타일 = 초타원으로 오린 배경(::before) + 그 위의 내용. 변이 직선이 아니라 모서리로 갈수록 부드럽게 말려 들어가는 쿠션 모양 (ref 의 '동글동글한 카드') */
.tile{position:relative;background:transparent;border-radius:var(--r);padding:26px 28px 24px;min-height:204px;display:flex;flex-direction:column;filter:drop-shadow(0 1px 0 var(--line-2)) drop-shadow(0 18px 22px rgba(0,0,0,.10));transition:transform 220ms var(--ease-out),opacity 200ms ease}
.tile::before{content:"";position:absolute;inset:0;background:var(--tile);border-radius:var(--r);clip-path:var(--shape,none);transition:background 200ms ease}
.tile>*{position:relative}
@media (hover:hover) and (pointer:fine){.tile:hover{transform:translateY(-2px)}}
.tile .head{display:flex;align-items:center;gap:12px;padding-right:52px}
.tile .ring{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex:none;position:relative}
.tile .ring .ic{width:17px;height:17px}
.tile .ring .bad{position:absolute;right:-3px;top:-3px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--err)}
.tile .ttl{font-size:16px;font-weight:400;line-height:1.2;color:var(--ink)}
.tile .ttl small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;font-weight:400}
.tile .go{position:absolute;right:22px;top:22px;width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform 160ms var(--ease-out),background 200ms ease,color 200ms ease}
.tile .go .ic{width:15px;height:15px;stroke-width:1.8;transition:transform 220ms var(--ease-out)}
.tile .go:active{transform:scale(.92)}
.tile .go[data-state="busy"]{background:var(--ink-3)}
.tile .go[data-state="ok"]{background:var(--ok);color:#fff}
.tile .go[data-state="fail"]{background:var(--err);color:#fff}
.tile.open .go .ic{transform:rotate(45deg)}
.tile .bot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:22px}
.tile .n{font-size:46px;font-weight:300;line-height:1;letter-spacing:-.04em;white-space:nowrap}
.tile .n small{font-size:14px;color:var(--ink-3);font-weight:400;margin-left:5px;letter-spacing:0}
.tile .n.dim{color:var(--ink-3)}
.tile .glyph{width:96px;height:30px;flex:none}
.tile .glyph canvas{width:100%;height:100%;display:block}
.tile.off{opacity:.55}
@media (hover:hover) and (pointer:fine){.tile.off:hover{opacity:1}}
.tile.alarm .ttl small{color:var(--err)}
.tile .status{position:absolute;left:20px;bottom:18px;display:none}
/* 조작 모드: 화살표를 누르면 글리프 자리가 점 슬라이더로 바뀐다 */
.tile .ctl{display:none;margin-top:auto;padding-top:16px;align-items:center;gap:14px}
.tile.open .bot{display:none}.tile.open .ctl{display:flex}
.tile.open{color:var(--bg);--line:rgba(255,255,255,.22);--ink-3:rgba(255,255,255,.55)}
.tile.open::before{background:var(--ink)}
.tile.open .ttl,.tile.open .ring{color:var(--bg)}
.tile.open .go{background:var(--bg);color:var(--ink)}
.tile.open .go[data-state="ok"]{background:var(--ok);color:#fff}.tile.open .go[data-state="fail"]{background:var(--err);color:#fff}
.tile .ctl .n{font-size:40px}
.tile .ctl .n small{color:inherit;opacity:.6}

/* 점 슬라이더: 5개 점 = 프리셋, 중간 점 = 실측, 큰 흰 노브 = 지령 */
.dots{position:relative;flex:1;height:36px;cursor:grab;touch-action:none;min-width:120px}
.dots i{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:currentColor;opacity:.45;transition:transform 160ms var(--ease-out),opacity 160ms ease}
.dots i.on{opacity:.9;transform:scale(1.3)}
.dots .act{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:currentColor;opacity:.55;transition:left 320ms linear}
.dots .knob{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.06);transition:transform 160ms var(--ease-out),box-shadow 160ms ease}
.dots.drag{cursor:grabbing}.dots.drag .knob{transform:scale(1.12);box-shadow:0 4px 12px rgba(0,0,0,.32),0 0 0 6px rgba(255,255,255,.18)}
.dots.pend .knob{box-shadow:0 2px 6px rgba(0,0,0,.28),0 0 0 3px var(--accent)}
@media (hover:hover) and (pointer:fine){.dots:hover .knob{transform:scale(1.06)}}

/* 글래스 타일 — 흐린 사진 위의 어두운 유리. 그룹 지령이 여기 산다 */
.glass{color:#fff;min-height:244px;border-radius:var(--r-xl);filter:drop-shadow(0 24px 30px rgba(0,0,0,.28))}
.glass::before{background:
  radial-gradient(70% 90% at 18% 28%,rgba(255,178,96,.95),rgba(255,178,96,0) 62%),
  radial-gradient(65% 80% at 82% 72%,rgba(96,140,200,.95),rgba(96,140,200,0) 62%),
  radial-gradient(55% 60% at 55% 15%,rgba(40,46,60,.9),rgba(40,46,60,0) 60%),
  linear-gradient(160deg,#4a4a52,#23232a)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;clip-path:var(--shape,none);background:rgba(20,20,24,.28);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);pointer-events:none}
.glass>*{position:relative;z-index:1}
.glass .ring{border-color:rgba(255,255,255,.35);color:#fff}
.glass .ttl{color:#fff}.glass .ttl small{color:rgba(255,255,255,.6)}
.glass .go{background:#fff;color:#111}
.glass .go[data-state="busy"]{background:rgba(255,255,255,.55);color:#111}
.glass .n{color:#fff}.glass .n small{color:rgba(255,255,255,.6)}
.glass .dots{color:#fff}
.glass .meta{display:flex;gap:14px;font-size:12px;color:rgba(255,255,255,.7);margin-top:10px}
.glass .meta b{font-weight:400;color:#fff}
.glass .bot{align-items:center}

/* 멤버 점 글리프 (ref 의 Hard Inquiries) */
.mdots{display:grid;grid-template-columns:repeat(5,14px);gap:8px 10px;justify-content:end}
.mdots i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent}
.mdots i.run{background:var(--ink);border-color:var(--ink)}.mdots i.alarm{background:var(--err);border-color:var(--err)}.mdots i.off{opacity:.4}

/* =====================================================================
   5. 운전 이력 — 어두운 섹션, 가는 막대, 점선, 기간 알약, 떠 있는 값 카드
   ===================================================================== */
.hist{margin-top:28px;background:var(--dark);color:var(--dark-ink);border-radius:var(--r-xl);padding:34px 36px 30px;position:relative;overflow:hidden}
.hist .hd{display:flex;align-items:center;gap:12px}
.hist h2{font-size:30px;font-weight:300;letter-spacing:-.02em}
.hist .pills{margin-left:auto}
.hist .pill{border-color:var(--dark-line);color:var(--dark-ink)}
.hist .pill.on{background:var(--dark-ink);color:var(--dark);border-color:var(--dark-ink)}
.chart{position:relative;height:220px;margin-top:22px}
.chart canvas{position:absolute;inset:0;width:100%;height:100%}
.chart .yl{position:absolute;left:0;font-size:11px;color:var(--dark-ink-2);transform:translateY(-50%)}
.chart .tip{position:absolute;background:var(--dark-2);border:1px solid var(--dark-line);border-radius:22px;padding:12px 14px;min-width:150px;transform:translate(-50%,-112%);transition:left 320ms linear,top 320ms linear;box-shadow:0 20px 40px -20px rgba(0,0,0,.8);pointer-events:none}
.chart .tip b{font-size:22px;font-weight:300;letter-spacing:-.02em;display:block}
.chart .tip b small{font-size:12px;color:var(--ok);margin-left:6px;font-weight:400}
.chart .tip span{font-size:11.5px;color:var(--dark-ink-2)}

/* =====================================================================
   6. 멤버 타일 그리드 · 섹션 머리
   ===================================================================== */
.sec{display:flex;align-items:baseline;gap:12px;margin:30px 4px 14px}
.sec h2{font-size:30px;font-weight:300;letter-spacing:-.02em}
.sec small{font-size:13px;color:var(--ink-3)}
.sec .pills{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:60px}

/* 토스트 */
.toasts{position:fixed;right:24px;bottom:84px;z-index:40;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 18px;font-size:13px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);transition:transform 260ms var(--ease-out),opacity 200ms ease}
@starting-style{.toast{transform:translateY(12px);opacity:0}}
.toast.out{opacity:0;transform:translateY(6px);transition-duration:150ms,120ms}

/* 검토 패널 */
.draft{position:fixed;right:20px;bottom:20px;z-index:35;background:var(--tile);color:var(--ink-3);border:1px dashed var(--line);border-radius:20px;padding:9px 11px;font-size:11.5px;display:flex;flex-direction:column;gap:6px}
.draft b{color:var(--ink);font-size:11px}
.draft .row{display:flex;align-items:center;gap:6px}
.draft .row>span{width:30px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;height:26px}
.seg button{padding:0 10px;font-size:11px;color:var(--ink-3)}.seg button.on{background:var(--ink);color:var(--bg)}

@media (max-width:1100px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.score .big{font-size:88px}}
@media (max-width:640px){.wrap{padding:0 16px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.pills.nav{display:none}.title{font-size:36px}}
@media (prefers-reduced-motion:reduce){.tile,.toast,.dots i,.dots .knob,.gauge .needle,.dots .act{transition:none}.toast{transition:opacity 150ms ease}}
</style>
</head>
<body>
<div class="blobs"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 8h14M5 16h10"/></symbol>
  <symbol id="i-fan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-3.5-2.6-6-5-5-1.4.6-1.2 2.8.5 4 1.6 1.1 4.5 1 4.5 1zM14 12c3.5 0 6 2.6 5 5-.6 1.4-2.8 1.2-4-.5-1.1-1.6-1-4.5-1-4.5zM12 14c0 3.5 2.6 6 5 5 1.4-.6 1.2-2.8-.5-4-1.6-1.1-4.5-1-4.5-1zM10 12c-3.5 0-6-2.6-5-5 .6-1.4 2.8-1.2 4 .5 1.1 1.6 1 4.5 1 4.5z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
</svg>

<div class="wrap">
  <header class="top">
    <button class="circ press" aria-label="메뉴"><svg class="ic"><use href="#i-menu"/></svg></button>
    <span class="brand"><span class="circ fill"><svg class="ic" style="stroke-width:1.8"><use href="#i-fan"/></svg></span>FanCM</span>
    <nav class="pills nav" aria-label="주 메뉴">
      <button class="pill press on">Dashboard</button><button class="pill press">Layout</button><button class="pill press">Device</button><button class="pill press">Chart</button><button class="pill press">Terminal</button>
    </nav>
    <div class="pills" style="margin-left:14px">
      <button class="pill press" id="portPill"><span class="dot"></span>COM3 · 19200</button>
      <button class="pill press on" id="livePill">Live · 320 ms</button>
    </div>
  </header>

  <!-- ───────── Hero ───────── -->
  <section class="hero">
    <div class="hero-l">
      <h1 class="title">급기 <b>팬월 A</b></h1>
      <div class="tabs"><button class="pill sm press on">EC-FAN 3G</button><button class="pill sm press">5대</button><button class="pill sm press">설정 일치</button></div>
      <div class="score">
        <div>
          <div class="lbl"><b id="devLbl">편차 ±2</b> RPM</div>
          <div class="big num" id="avg">1,248</div>
          <div class="cap"><b>안정 · 3대 운전</b>RPM 평균 · 320 ms 마다 갱신</div>
        </div>
        <svg class="gauge" viewBox="0 0 220 140" aria-hidden="true">
          <path class="arc" d="M20 120 A90 90 0 0 1 200 120"/>
          <path class="arc2" id="arc2" d="M20 120 A90 90 0 0 1 200 120" pathLength="1" stroke-dasharray="0 1"/>
          <line class="needle" id="needle" x1="110" y1="120" x2="110" y2="34"/>
          <circle class="pin" cx="110" cy="120" r="2.5"/>
        </svg>
      </div>
      <div class="two">
        <div class="tile">
          <div class="head"><span class="ring"><svg class="ic"><use href="#i-target"/></svg></span><div class="ttl">그룹<br>지령<small>마지막 쓰기 · 0.2초 전</small></div></div>
          <button class="go press" id="goSp" aria-label="지령 조작"><svg class="ic"><use href="#i-arrow"/></svg></button>
          <div class="bot"><div class="n num" id="spBig">1,250<small>RPM</small></div><div class="glyph"><canvas id="gSp"></canvas></div></div>
        </div>
        <div class="tile" id="excTile">
          <div class="head"><span class="ring"><svg class="ic"><use href="#i-bell"/></svg><i class="bad" id="excBad"></i></span><div class="ttl">예외<br>현황<small id="excSub">알람 1 · 오프라인 1</small></div></div>
          <button class="go press" id="goExc" aria-label="예외 보기"><svg class="ic"><use href="#i-arrow"/></svg></button>
          <div class="bot"><div class="n num" id="excN">2<small>건</small></div><div class="mdots" id="mdots"></div></div>
        </div>
      </div>
    </div>

    <div class="hero-r">
      <div class="tile glass" id="glass">
        <div class="head"><span class="ring"><svg class="ic"><use href="#i-layers"/></svg></span><div class="ttl">전체 지령<small>5대 중 4대 쓰기 · 순차</small></div></div>
        <button class="go press" id="goAll" data-state="idle" aria-label="전체 적용"><svg class="ic"><use href="#i-arrow"/></svg></button>
        <div class="bot"><div class="n num" id="gPct">78<small>%</small></div>
          <div class="dots" id="gDots" role="slider" aria-label="그룹 지령" aria-valuemin="0" aria-valuemax="1600" aria-valuenow="1250"><i style="left:0%"></i><i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i><i style="left:100%"></i><span class="act" id="gAct" style="left:78%"></span><span class="knob" id="gKnob" style="left:78.1%"></span></div></div>
        <div class="meta"><span>지령 <b id="gSpv">1,250 RPM</b></span><span>평균 <b id="gAvg">1,248</b></span><span>순차 간격 <b>0.3 s</b></span></div>
      </div>
      <div class="tile">
        <div class="head"><span class="ring"><svg class="ic"><use href="#i-wave"/></svg></span><div class="ttl">편차<small>운전 중 멤버 간 최대 차이</small></div></div>
        <button class="go press" aria-label="차트에서 보기"><svg class="ic"><use href="#i-arrow"/></svg></button>
        <div class="bot"><div class="n num" id="devBig">±2<small>RPM</small></div><div class="glyph"><canvas id="gDev"></canvas></div></div>
      </div>
    </div>
  </section>

  <!-- ───────── 운전 이력 ───────── -->
  <section class="hist">
    <div class="hd"><h2>운전 이력</h2><div class="pills" id="periods"><button class="pill sm press on" data-n="40">1분</button><button class="pill sm press" data-n="90">10분</button><button class="pill sm press" data-n="180">1시간</button></div></div>
    <div class="chart" id="chart"><span class="yl" style="top:8%">1,600</span><span class="yl" style="top:45%">800</span><span class="yl" style="top:92%">0</span><canvas id="hc"></canvas><div class="tip" id="htip"><b class="num"><span id="htv">1,248</span><small id="htd">+0.2%</small></b><span>안정 · 평균 RPM</span></div></div>
  </section>

  <!-- ───────── 멤버 ───────── -->
  <div class="sec"><h2>멤버</h2><small>화살표를 누르면 그 팬만 따로 조작합니다</small><div class="pills"><button class="pill sm press on">전체</button><button class="pill sm press">운전</button><button class="pill sm press">예외</button></div></div>
  <div class="grid" id="grid"></div>
</div>

<div class="toasts" id="toasts"></div>
<div class="draft" id="draft"><b>초안 검토용</b><div class="row"><span>테마</span><div class="seg" id="dTheme"><button class="on" data-v="">기본</button><button data-v="light">화이트</button><button data-v="dark">다크</button></div></div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const q=new URLSearchParams(location.search);
const fmt=n=>Math.round(n).toLocaleString(); const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const REDUCED=matchMedia('(prefers-reduced-motion:reduce)');
function setTheme(t){const h=document.documentElement;h.classList.add('theming');if(t)h.dataset.theme=t;else delete h.dataset.theme;clearTimeout(setTheme.t);setTheme.t=setTimeout(()=>h.classList.remove('theming'),350);$$('#dTheme button').forEach(b=>b.classList.toggle('on',b.dataset.v===(t||'')));setTimeout(drawAll,30)}
if(q.get('theme'))setTheme(q.get('theme'));if(q.get('embed'))$('#draft').hidden=true;
$('#dTheme').onclick=e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.v)};

/* ---------- 데이터 ---------- */
const MAX=1600;
const devices=[
  {id:'d1',name:'Fan-01',model:'EC-FAN 3G',slave:7,st:'run',sp:1250,actual:1248},
  {id:'d2',name:'Fan-02',model:'EC-FAN 3G',slave:8,st:'run',sp:1250,actual:1236},
  {id:'d3',name:'Fan-03',model:'EC-FAN 3G',slave:9,st:'alarm',sp:1000,actual:0,alarm:'과전류 0x0004',failOnce:true},
  {id:'d4',name:'Fan-04',model:'EC-FAN 3G',slave:10,st:'run',sp:1250,actual:1229},
  {id:'d5',name:'Fan-05',model:'EC-FAN 3G',slave:11,st:'off',sp:600,actual:null},
  {id:'d6',name:'Fan-06',model:'NX-FAN 300',slave:23,st:'run',sp:960,actual:958,solo:true},
];
devices.forEach(d=>{d.hist=Array.from({length:60},()=>d.actual==null?0:d.actual+(Math.random()-.5)*6);d.write='idle'});
const group={sp:1250,write:'idle',members:['d1','d2','d3','d4','d5']};
const avgHist=Array.from({length:180},(_,i)=>1240+Math.sin(i/9)*6+(Math.random()-.5)*4);
let live=true, period=40;
const gm=()=>group.members.map(id=>devices.find(d=>d.id===id));
const stats=()=>{const run=gm().filter(d=>d.st==='run'&&Math.round(d.sp)===Math.round(group.sp));const v=run.map(d=>d.actual||0);const avg=v.length?v.reduce((a,b)=>a+b,0)/v.length:0;const dev=v.length>1?Math.max(...v.map(x=>Math.abs(x-avg))):0;return {run,avg,dev}};

/* ---------- 쿠션 윤곽: |x/a|^n + |y/b|^n = 1 인 초타원을 타일 크기에 맞춰 경로로 만든다.
   n 이 작을수록 통통하고(4 = iOS 아이콘), 클수록 변이 곧아진다. 기본 5. ---------- */
const PILLOW=+(q.get('n')||5);
function superPath(W,H,n=PILLOW,steps=96){const a=W/2,b=H/2,e=2/n;let d='';
  for(let i=0;i<steps;i++){const t=i/steps*Math.PI*2,c=Math.cos(t),s_=Math.sin(t);const x=a+a*Math.sign(c)*Math.abs(c)**e,y=b+b*Math.sign(s_)*Math.abs(s_)**e;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
  return `path("${d}Z")`}
const shapeRO=new ResizeObserver(es=>es.forEach(e=>e.target.style.setProperty('--shape',superPath(e.target.offsetWidth,e.target.offsetHeight))));
function notchAll(){$$('.tile').forEach(el=>{shapeRO.observe(el);el.style.setProperty('--shape',superPath(el.offsetWidth,el.offsetHeight))})}

/* ---------- 멤버 타일 ---------- */
const ST={run:'운전 중',alarm:'알람',off:'오프라인',stop:'정지'};
function tileHTML(d){const p=d.sp/MAX*100;
  return `<div class="tile ${d.st}${d.st==='off'?' off':''}" data-id="${d.id}">
    <div class="head"><span class="ring"><svg class="ic"><use href="#i-fan"/></svg>${d.st==='alarm'?'<i class="bad"></i>':''}</span><div class="ttl">${d.name}<small>${d.st==='alarm'?d.alarm:d.model+' · ID '+d.slave}</small></div></div>
    <button class="go press" data-state="${d.write}" aria-label="${d.name} 조작"><svg class="ic"><use href="#i-arrow"/></svg></button>
    <div class="bot"><div class="n num${d.actual?'':' dim'}"><span class="a">${d.actual==null?'—':fmt(d.actual)}</span><small>${d.st==='off'?'응답 없음':'RPM'}</small></div><div class="glyph"><canvas></canvas></div></div>
    <div class="ctl"><div class="n num"><span class="spv">${fmt(d.sp)}</span><small>RPM 지령</small></div>
      <div class="dots" role="slider" aria-valuemin="0" aria-valuemax="${MAX}" aria-valuenow="${Math.round(d.sp)}"><i style="left:0%"></i><i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i><i style="left:100%"></i><span class="act" style="left:${(d.actual||0)/MAX*100}%"></span><span class="knob" style="left:${p}%"></span></div></div>
  </div>`}
function renderGrid(){$('#grid').innerHTML=devices.map(tileHTML).join('');drawAll();notchAll()}
const tile=d=>document.querySelector(`.tile[data-id="${d.id}"]`);

/* ---------- 글리프 · 게이지 · 이력 ---------- */
let ink='#121212';
function spark(cv,pts,opt={}){const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  if(opt.bars){const n=pts.length,bw=Math.max(2,W/n*.42),lo=Math.min(...pts),hi=Math.max(...pts),rg=Math.max(hi-lo,8);x.fillStyle=opt.color||ink;pts.forEach((v,i)=>{const h=4+(v-lo)/rg*(H-6);x.globalAlpha=.3+.7*(i/n);x.fillRect(i/n*W,H-h,bw,h)});x.globalAlpha=1;return}
  x.beginPath();pts.forEach((v,i)=>{const px=i/(pts.length-1)*W,py=H-2-clamp(v/MAX,0,1)*(H-4);i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle=opt.color||ink;x.lineWidth=1.3;x.lineJoin='round';x.globalAlpha=opt.alpha??.9;x.stroke();x.globalAlpha=1}
function drawAll(){ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
  $$('.tile[data-id] .glyph canvas').forEach(cv=>{const d=devices.find(x=>x.id===cv.closest('.tile').dataset.id);spark(cv,d.hist.slice(-40),{alpha:d.st==='off'?.3:.9})});
  spark($('#gSp'),avgHist.slice(-12),{bars:true});spark($('#gDev'),avgHist.slice(-40).map((v,i,a)=>800+Math.abs(v-(a[i-1]??v))*40),{alpha:.6});drawHist()}
function drawHist(){const cv=$('#hc'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const pts=avgHist.slice(-period),n=pts.length,L=52,R=10,T=14,B=14,w=W-L-R,h=H-T-B;
  x.strokeStyle='rgba(255,255,255,.12)';x.setLineDash([2,5]);x.lineWidth=1;[0,1,2,3].forEach(i=>{const y=T+h*i/3;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke()});x.setLineDash([]);
  const step=Math.max(1,Math.round(n/6)),bw=Math.max(2,Math.min(6,w/n*.22));let hotIdx=0;
  pts.forEach((v,i)=>{const bx=L+i/n*w,bh=clamp(v/MAX,0,1)*h;const hot=i%step===0;x.fillStyle=hot?'#e8603c':'rgba(255,255,255,.38)';x.fillRect(bx,T+h-bh,bw,bh);
    if(hot){if(i<=n*.62)hotIdx=i;x.strokeStyle='rgba(255,255,255,.18)';x.setLineDash([2,4]);x.beginPath();x.moveTo(bx+bw/2,T);x.lineTo(bx+bw/2,T+h-bh);x.stroke();x.setLineDash([])}});
  const v=pts[hotIdx],prev=pts[Math.max(0,hotIdx-step)];const tip=$('#htip');tip.style.left=(L+hotIdx/n*w+bw/2)+'px';tip.style.top=Math.max(76,T+h-clamp(v/MAX,0,1)*h-6)+'px';$('#htv').textContent=fmt(v);const d=prev?(v-prev)/prev*100:0;$('#htd').textContent=(d>=0?'+':'')+d.toFixed(1)+'%';$('#htd').style.color=Math.abs(d)<1?'var(--ok)':'#e8603c'}
$('#periods').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;$$('#periods button').forEach(x=>x.classList.toggle('on',x===b));period=+b.dataset.n;drawHist()};

function paintGroup(){const s=stats();$('#avg').textContent=fmt(s.avg);$('#gAvg').textContent=fmt(s.avg);$('#devLbl').textContent=`편차 ±${fmt(s.dev)}`;$('#devBig').innerHTML=`±${fmt(s.dev)}<small>RPM</small>`;
  $('#needle').style.transform=`rotate(${-90+clamp(s.avg/MAX,0,1)*180}deg)`;$('#arc2').style.strokeDasharray=`${clamp(s.avg/MAX,0,1)} 1`;$('#gAct').style.left=(s.avg/MAX*100)+'%';
  const ms=gm();$('#mdots').innerHTML=ms.map(d=>`<i class="${d.st}" title="${d.name}"></i>`).join('');const exc=ms.filter(d=>d.st==='alarm'||d.st==='off');$('#excN').innerHTML=`${exc.length}<small>건</small>`;$('#excSub').textContent=exc.length?[ms.some(d=>d.st==='alarm')?`알람 ${ms.filter(d=>d.st==='alarm').length}`:'',ms.some(d=>d.st==='off')?`오프라인 ${ms.filter(d=>d.st==='off').length}`:''].filter(Boolean).join(' · '):'모두 정상';$('#excBad').hidden=!ms.some(d=>d.st==='alarm');
  const cap=$('.score .cap b');cap.textContent=`${s.dev>Math.max(20,group.sp*.03)?'편차 큼':'안정'} · ${ms.filter(d=>d.st==='run').length}대 운전`}

/* ---------- 폴링 시뮬레이션 (320ms) ---------- */
setInterval(()=>{if(!live)return;
  for(const d of devices){if(d.st==='off')continue;const t=d.st==='run'?d.sp:0;d.actual=(d.actual??0)+(t-(d.actual??0))*.35+(d.st==='run'?(Math.random()-.5)*6:0);if(Math.abs(d.actual-t)<.6)d.actual=t;d.hist.push(d.actual);if(d.hist.length>60)d.hist.shift();
    const el=tile(d);if(el){el.querySelector('.a').textContent=fmt(d.actual);el.querySelector('.n').classList.toggle('dim',!d.actual);el.querySelector('.dots .act').style.left=(d.actual/MAX*100)+'%';spark(el.querySelector('.glyph canvas'),d.hist.slice(-40))}}
  const s=stats();avgHist.push(s.avg);if(avgHist.length>180)avgHist.shift();paintGroup();spark($('#gSp'),avgHist.slice(-12),{bars:true});drawHist()},320);
$('#livePill').onclick=()=>{live=!live;$('#livePill').classList.toggle('on',live);$('#livePill').textContent=live?'Live · 320 ms':'Live 멈춤';toast(live?'Live Watch 켜짐':'Live Watch 꺼짐 · 폴링 중지')};

/* ---------- 쓰기: 화살표 버튼이 상태가 된다 (→ 스피너 → ✓) ---------- */
function setGo(btn,state){if(!btn)return;btn.dataset.state=state;btn.innerHTML=state==='busy'?'<svg class="ic" style="animation:rot .7s linear infinite"><use href="#i-spin"/></svg>':state==='ok'?'<svg class="ic"><use href="#i-check"/></svg>':state==='fail'?'<svg class="ic"><use href="#i-x"/></svg>':'<svg class="ic"><use href="#i-arrow"/></svg>'}
const style=document.createElement('style');style.textContent='@keyframes rot{to{transform:rotate(360deg)}}';document.head.appendChild(style);
function commit(d,v){v=clamp(Math.round(v),0,MAX);d.sp=v;if(d.st==='stop'&&v>0)d.st='run';if(d.st==='run'&&v===0)d.st='stop';
  const el=tile(d);if(el){el.querySelector('.spv').textContent=fmt(v);el.querySelector('.dots .knob').style.left=(v/MAX*100)+'%';el.querySelector('.dots').classList.remove('pend');el.querySelectorAll('.dots i').forEach((i,k)=>i.classList.toggle('on',Math.round(v/MAX*100)===k*25));el.querySelector('.ttl small').textContent=d.st==='alarm'?d.alarm:d.model+' · ID '+d.slave;el.className=`tile ${d.st}${el.classList.contains('open')?' open':''}`}
  d.write='busy';setGo(el?.querySelector('.go'),'busy');clearTimeout(d._w);
  d._w=setTimeout(()=>{const ok=!d.failOnce;d.failOnce=false;d.write=ok?'ok':'fail';setGo(el?.querySelector('.go'),d.write);if(ok)d._w=setTimeout(()=>{d.write='idle';setGo(el?.querySelector('.go'),'idle')},1400)},640)}
function groupApply(v){v=clamp(Math.round(v),0,MAX);group.sp=v;const targets=gm().filter(d=>d.st!=='off'&&!d.solo);const btn=$('#goAll');setGo(btn,'busy');$('#gSpv').textContent=`${fmt(v)} RPM`;$('#spBig').innerHTML=`${fmt(v)}<small>RPM</small>`;$('#gPct').innerHTML=`${Math.round(v/MAX*100)}<small>%</small>`;$('#gKnob').style.left=(v/MAX*100)+'%';$('#gDots').classList.remove('pend');$('#gDots').setAttribute('aria-valuenow',v);
  $$('#gDots i').forEach((i,k)=>i.classList.toggle('on',Math.round(v/MAX*100)===k*25));let done=0,fail=0;
  targets.forEach((d,i)=>setTimeout(()=>{commit(d,v);setTimeout(()=>{done++;if(d.write==='fail')fail++;if(done===targets.length){setGo(btn,fail?'fail':'ok');toast(fail?`${targets.length-fail}/${targets.length} 확인 · ${fail}대 실패`:`${targets.length}대 모두 ${fmt(v)} RPM 확인됨`);setTimeout(()=>setGo(btn,'idle'),1800)}},700)},i*280))}

/* ---------- 점 슬라이더: 끌면 1:1, 점을 누르면 그 자리로, 놓으면 쓰기 ---------- */
let drag=null;
document.addEventListener('pointerdown',e=>{const dots=e.target.closest('.dots');if(!dots||e.button)return;e.preventDefault();dots.setPointerCapture(e.pointerId);
  const r=dots.getBoundingClientRect(),kr=dots.querySelector('.knob').getBoundingClientRect();const onKnob=e.clientX>=kr.left-8&&e.clientX<=kr.right+8;
  drag={dots,r,off:onKnob?e.clientX-(kr.left+kr.width/2):0,x0:e.clientX,moved:false,v:null,group:dots.id==='gDots'}});
document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved){if(Math.abs(e.clientX-drag.x0)<4)return;drag.moved=true;drag.dots.classList.add('drag')}
  const p=clamp((e.clientX-drag.off-drag.r.left)/drag.r.width,0,1);drag.v=Math.round(p*MAX);drag.dots.querySelector('.knob').style.left=(p*100)+'%';drag.dots.classList.add('pend');
  if(drag.group){$('#gPct').innerHTML=`${Math.round(p*100)}<small>%</small>`;$('#gSpv').textContent=`${fmt(drag.v)} RPM`}else{drag.dots.closest('.tile').querySelector('.spv').textContent=fmt(drag.v)}});
const up=e=>{if(!drag)return;const dr=drag;drag=null;dr.dots.classList.remove('drag');
  if(!dr.moved){const dot=e.target.closest('.dots > i');if(dot){const p=parseFloat(dot.style.left)/100;dr.group?groupApply(p*MAX):commit(devices.find(d=>d.id===dr.dots.closest('.tile').dataset.id),p*MAX)}else dr.dots.classList.remove('pend');return}   // 탭은 점 위에서만 의미가 있다
  if(dr.group)groupApply(dr.v);else commit(devices.find(d=>d.id===dr.dots.closest('.tile').dataset.id),dr.v)};
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);

/* ---------- 타일 화살표: 조작 모드로 뒤집힘 / 전체 적용 / 예외 ---------- */
document.addEventListener('click',e=>{
  const go=e.target.closest('.go');if(!go)return;
  const t=go.closest('.tile[data-id]');if(t){t.classList.toggle('open');return}
  if(go.id==='goAll'){groupApply(group.sp);return}
  if(go.id==='goSp'){$('#glass .dots .knob').animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:500,easing:'cubic-bezier(.23,1,.32,1)'});$('#glass').scrollIntoView({behavior:'smooth',block:'center'});return}
  if(go.id==='goExc'){const a=devices.find(d=>d.st==='alarm');if(a){a.st='stop';a.alarm=null;renderGrid();paintGroup();toast(`${a.name} 알람 리셋 완료`)}else toast('예외 없음');return}
});
$('#portPill').onclick=()=>toast('포트 설정 (프로토타입)');

/* ---------- 토스트 ---------- */
function toast(msg,ms=3200){const box=$('#toasts');while(box.children.length>=3)box.firstChild.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;box.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),160)},ms)}

renderGrid();paintGroup();notchAll();addEventListener('resize',drawAll);
</script>
</body>
</html>
