function setUnit(d,u){if(d.unit===u)return;const v=u==='%'?Math.round(d.sp/1600*100):Math.round(d.sp/100*1600);d.unit=u;d.max=u==='%'?100:1600;d.sp=v;const c=card(d);if(!c)return;
  const ub=c.querySelector('.unit-btn');if(ub)ub.innerHTML=`${u}<svg class="ic"><use href="#i-down"/></svg>`;c.querySelector('.num').value=v;c.querySelector('.spv').textContent=`${fmt(v)} ${u}`}
function editName(btn,d){const inp=document.createElement('input');inp.className='name-in';inp.value=d.name;btn.replaceWith(inp);inp.focus();inp.select();   // 인라인 편집: 애니메이션 없음. 그냥 바뀐다.
  const done=save=>{if(save&&inp.value.trim()){d.name=inp.value.trim()}const b=document.createElement('button');b.className='name';b.dataset.tip='클릭하여 이름 변경';b.textContent=d.name;inp.replaceWith(b);if(save)toast(`이름 변경됨 · ${d.name}`,'info');renderList(visible())};
  inp.onkeydown=e=>{if(e.key==='Enter')done(true);if(e.key==='Escape')done(false)};inp.onblur=()=>done(true)}
function resetAlarm(d,btn){morph(btn,'<span class="spin"></span>리셋 중');setTimeout(()=>{morph(btn,'<svg class="ic sm"><use href="#i-check"/></svg>리셋됨');setTimeout(()=>{d.st='stop';d.alarm=null;d.hot=false;d.write='idle';d.mon=[['Coil current','0xD03A','0.0 A']];$('#banner').classList.add('out');setTimeout(()=>render(false),180);toast(`${d.name} 알람 리셋 완료`)},700)},600)}

/* ---------- 바 드래그: 노브는 손가락과 1:1, 놓으면 쓰기 ---------- */
let bd=null, holdT=0, pressT=0;
content.addEventListener('pointerdown',e=>{
  if(e.button)return;
  const gbar=e.target.closest('.g-bar');if(gbar){const g=groups.find(x=>x.id===gbar.closest('.gcard').dataset.gid);e.preventDefault();gbar.setPointerCapture(e.pointerId);gbar.classList.add('drag');hideTip();
    const r=gbar.getBoundingClientRect(),kr=gbar.querySelector('.knob').getBoundingClientRect();const off=(e.clientX>=kr.left-6&&e.clientX<=kr.right+6)?e.clientX-(kr.left+kr.width/2):0;gd={bar:gbar,g,r,off,v:null};gBarMove(e);return}
  const stop=e.target.closest('.g-stop');if(stop){const g=groups.find(x=>x.id===stop.closest('.gcard').dataset.gid);stop.classList.add('holding');stop.setPointerCapture(e.pointerId);hideTip();
    clearTimeout(holdT);holdT=setTimeout(()=>{stop.classList.remove('holding');stop.dataset.fired='1';groupStop(g)},600);return}     // 600ms 를 채우면 정지, 그 전에 놓으면 200ms 로 되돌아간다
  const tile=e.target.closest('.tile');if(tile){tile.classList.add('pressing');clearTimeout(pressT);
    pressT=setTimeout(()=>{tile.classList.remove('pressing');tile.dataset.held='1';const d=devices.find(x=>x.id===tile.dataset.tile);d.solo=!d.solo;paintGroups();
      toast(d.solo?`${d.name} 개별 제어 · 그룹 지령에서 제외 · <u>되돌리기</u>`:`${d.name} 그룹으로 복귀`,'info',4000,()=>{d.solo=false;paintGroups()})},500);return}
  const bar=e.target.closest('.bar');if(!bar)return;const c=bar.closest('[data-id]');const d=devices.find(x=>x.id===c.dataset.id);if(d.st==='off')return;
  e.preventDefault();bar.setPointerCapture(e.pointerId);hideTip();
  const r=bar.getBoundingClientRect();const kr=bar.querySelector('.knob').getBoundingClientRect();const onKnob=e.clientX>=kr.left-6&&e.clientX<=kr.right+6;const off=onKnob?e.clientX-(kr.left+kr.width/2):0;   // 노브를 잡았으면 잡은 지점 유지
  bd={bar,d,r,off,v:null,x0:e.clientX,moved:false};if(!onKnob)move(e)});
function move(e){if(!bd)return;if(!bd.moved){if(Math.abs(e.clientX-bd.x0)<4)return;bd.moved=true;bd.bar.classList.add('drag')}   /* 4px 히스테리시스: 트랙을 스친 것만으로는 지령이 바뀌지 않는다 */
  const p=clamp((e.clientX-bd.off-bd.r.left)/bd.r.width,0,1);bd.v=Math.round(p*bd.d.max);bd.bar.querySelector('.knob').style.left=(p*100)+'%';bd.bar.querySelector('.sfill').style.width=(p*100)+'%';const c=bd.bar.closest('[data-id]');c.querySelector('.num').value=bd.v;const s=c.querySelector('.spv');s.textContent=`${fmt(bd.v)} ${bd.d.unit}`;s.classList.add('pending')}
content.addEventListener('pointermove',e=>{move(e);gBarMove(e)});
const endBar=e=>{
  if(gd){const {bar,g,v}=gd;gd=null;bar.classList.remove('drag');if(v!=null&&v!==g.sp)groupApply(g,v);else{const sv=gcardEl(g)?.querySelector('.g-spv');sv&&sv.classList.remove('pending')}}
  const stop=e.target.closest?.('.g-stop');if(stop||holdT){clearTimeout(holdT);holdT=0;$$('.g-stop.holding').forEach(b=>b.classList.remove('holding'));if(stop&&stop.dataset.fired){delete stop.dataset.fired}}
  if(pressT){clearTimeout(pressT);pressT=0;$$('.tile.pressing').forEach(t=>t.classList.remove('pressing'))}
  if(!bd)return;const {bar,d,v}=bd;bd=null;bar.classList.remove('drag');if(v!=null&&v!==d.sp)commit(d,v);else{const c=card(d);if(c){const s=c.querySelector('.spv');s&&s.classList.remove('pending');const p=d.unit==='%'?d.sp:d.sp/d.max*100;c.querySelector('.knob').style.left=p+'%';c.querySelector('.sfill').style.width=p+'%';c.querySelector('.num').value=Math.round(d.sp)}}};
content.addEventListener('pointerup',endBar);content.addEventListener('pointercancel',endBar);

/* ---------- 선택 → 일괄 작업 바 ---------- */
function syncSel(){$$('.card').forEach(c=>{const on=sel.has(c.dataset.id);c.classList.toggle('selected',on);const ck=c.querySelector('.sel');if(ck)ck.checked=on});$$('#list tr[data-id]').forEach(r=>{const on=sel.has(r.dataset.id);r.classList.toggle('selected',on);const ck=r.querySelector('.sel');if(ck)ck.checked=on});updateSelAll();updateBulk()}
function updateSelAll(){const vis=visible().filter(d=>d.st!=='new');const n=vis.filter(d=>sel.has(d.id)).length;const sa=$('#selAll');sa.checked=n>0&&n===vis.length;sa.indeterminate=n>0&&n<vis.length}
let bulkTimer=0;
function updateBulk(){const b=$('#bulk');const ids=[...sel].filter(id=>devices.find(d=>d.id===id));$('#bulkN').textContent=ids.length;$('#bulkNames').textContent=ids.map(id=>devices.find(d=>d.id===id).name).join(', ');
  clearTimeout(bulkTimer);
  if(ids.length){b.hidden=false;b.style.transform='';requestAnimationFrame(()=>b.classList.remove('out'))}      // transition 이라 나가는 중에 다시 선택해도 그 자리에서 돌아온다
  else if(!b.hidden){b.classList.add('out');bulkTimer=setTimeout(()=>{b.hidden=true;b.classList.remove('out')},180)}}
function clearSel(){sel.clear();syncSel()}
$('#selAll').onchange=e=>{visible().filter(d=>d.st!=='new').forEach(d=>e.target.checked?sel.add(d.id):sel.delete(d.id));syncSel()};
$('#bulkClear').onclick=clearSel;
$('#bulkUnit').onclick=e=>{const b=e.target.closest('button');if(!b)return;segOn($('#bulkUnit'),b.dataset.u);$('#bulkUnitLbl').textContent=b.dataset.u;$('#bulkVal').value=b.dataset.u==='%'?50:800};
$('#bulkPresets').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#bulkPresets button').forEach(x=>x.classList.toggle('on',x===b));const u=$('#bulkUnit .on').dataset.u;$('#bulkVal').value=u==='%'?+b.textContent:Math.round(+b.textContent/100*1600)};
$('#bulkGo').onclick=()=>{const u=$('#bulkUnit .on').dataset.u,v=+$('#bulkVal').value;const ds=[...sel].map(id=>devices.find(d=>d.id===id)).filter(d=>d.st!=='off');ds.forEach(d=>{setUnit(d,u);commit(d,v)});toast(`${ds.length}대에 <b>${fmt(v)} ${u}</b> 적용 · 순서대로 쓰는 중`,'info')};
$('#bulkStop').onclick=()=>{const ds=[...sel].map(id=>devices.find(d=>d.id===id)).filter(d=>d.st!=='off');ds.forEach(d=>commit(d,0));toast(`${ds.length}대 정지 지령 전송`,'err')};
/* 아래로 끌어 내리면 해제. 임계값보다 속도가 먼저다: 짧고 빠른 플릭으로도 충분 */
let bdrag=null;const bulk=$('#bulk');
bulk.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,label,select'))return;bdrag={y:e.clientY,t:performance.now()};bulk.setPointerCapture(e.pointerId);bulk.classList.add('dragging')});
bulk.addEventListener('pointermove',e=>{if(!bdrag)return;let dy=e.clientY-bdrag.y;if(dy<0)dy=dy*.2;bulk.style.transform=`translate(-50%,${dy}px)`;bdrag.dy=dy});
const bulkUp=()=>{if(!bdrag)return;const {dy=0,t}=bdrag;bdrag=null;bulk.classList.remove('dragging');const v=Math.abs(dy)/(performance.now()-t);
  if(dy>48||(dy>8&&v>.11)){bulk.style.transform='';clearSel()}else bulk.style.transform=''};   // 되돌아올 때는 transition 이 받는다
bulk.addEventListener('pointerup',bulkUp);bulk.addEventListener('pointercancel',bulkUp);

/* ---------- 팝오버 메뉴: 트리거에서 자라 나오고, 키보드로 닫으면 즉시 ---------- */
let menu=null, menuTrigger=null;
function openMenu(trigger,html,{align='end'}={}){closeMenu(true);const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');m.innerHTML=html;document.body.appendChild(m);
  const r=trigger.getBoundingClientRect();const mw=m.offsetWidth,mh=m.offsetHeight;let top=r.bottom+6,left=align==='end'?r.right-mw:r.left;const below=top+mh<=innerHeight-8;if(!below)top=r.top-6-mh;
  left=clamp(left,8,innerWidth-mw-8);m.style.top=top+'px';m.style.left=left+'px';m.style.transformOrigin=`${below?'top':'bottom'} ${align==='end'?'right':'left'}`;
  trigger.setAttribute('aria-expanded','true');menu=m;menuTrigger=trigger;hideTip();
  m.addEventListener('keydown',e=>{const items=[...m.querySelectorAll('[role=menuitem]')];const i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length]?.focus()}if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length]?.focus()}if(e.key==='Tab'){closeMenu(true)}});
  setTimeout(()=>m.querySelector('[role=menuitem],select,input')?.focus({preventScroll:true}),0);return m}
function closeMenu(instant){if(!menu)return;const m=menu;menu=null;menuTrigger?.setAttribute('aria-expanded','false');
  if(instant||REDUCED.matches){m.remove();return}m.classList.add('out');setTimeout(()=>m.remove(),100)}
document.addEventListener('pointerdown',e=>{if(menu&&!menu.contains(e.target)&&!menuTrigger.contains(e.target))closeMenu(false)});
function openCardMenu(btn,d){const live=d.st!=='off'&&d.st!=='new';
  const m=openMenu(btn,`<button role="menuitem" data-act="chart"><svg class="ic sm"><use href="#i-chart"/></svg>차트에서 보기</button><button role="menuitem" data-act="config"><svg class="ic sm"><use href="#i-set"/></svg>설정 (Configuration)</button><button role="menuitem" data-act="addr"><svg class="ic sm"><use href="#i-tag"/></svg>이름 · Fan Address 변경</button><button role="menuitem" data-act="watch"><svg class="ic sm"><use href="#i-mon"/></svg>이 디바이스만 Live Watch 끄기</button><hr>${live?'<button role="menuitem" data-act="alarm"><svg class="ic sm"><use href="#i-bell"/></svg>알람 리셋</button><button role="menuitem" data-act="sw"><svg class="ic sm"><use href="#i-refresh"/></svg>소프트웨어 리셋</button><hr>':''}<button role="menuitem" class="danger" data-act="rm"><svg class="ic sm"><use href="#i-trash"/></svg>목록에서 제거</button>`);
  m.onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;closeMenu(false);
    if(act==='rm'){const i=devices.indexOf(d);devices.splice(i,1);sel.delete(d.id);render(false);syncSel();toast(`${d.name} 목록에서 제거됨 · <u>실행 취소</u>`,'info',5000,()=>{devices.splice(i,0,d);render(false);toast(`${d.name} 복구됨`,'info')})}
    else if(act==='sw')toast(`${d.name} 소프트웨어 리셋 · 0xD000 ← 1`,'info');else if(act==='alarm')toast(`${d.name} 알람 리셋 전송`,'info');else if(act==='watch')toast(`${d.name} 폴링 제외 · 카드는 마지막 값 유지`,'info');
    else toast(`${act==='chart'?'Chart':act==='config'?'Device › Configuration':'이름 · 주소'} 로 이동 (프로토타입)`,'info')}}
$('#portChip').onclick=()=>{const m=openMenu($('#portChip'),`<div class="pop-form"><h4>Serial Port</h4><div class="row2"><div><label>Port</label><select><option>COM3 — USB Serial (CH340)</option><option>COM5</option></select></div><div><label>Baud</label><select><option>9600</option><option selected>19200</option><option>38400</option><option>115200</option></select></div></div><div class="row2"><div><label>Parity</label><select><option>None</option><option>Even</option><option>Odd</option></select></div><div><label>Data / Stop</label><select><option>8 / 1</option><option>8 / 2</option></select></div></div><div class="foot"><button class="btn sm ghost" data-act="dc">연결 해제</button><button class="btn sm primary" data-act="rc">다시 연결</button></div></div>`);
  m.onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;closeMenu(false);toast(b.dataset.act==='dc'?'COM3 연결 해제':'COM3 다시 연결 · 19200 8N1','info')}};
$('#statsChip').onclick=()=>{$('#errN').textContent='0';toast('통신 통계 리셋','info')};
$('#groupBtn').onclick=()=>{grouped=!grouped;$('#groupBtn').setAttribute('aria-pressed',grouped);render(false)};
$('#viewSeg').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.view)};
function setView(v){view=v;segOn($('#viewSeg'),v);$('#groups').hidden=v!=='grid';$('#listWrap').hidden=v!=='list';if(v==='grid')drawAll()}
$('#scanBtn').onclick=()=>{const b=$('#scanBtn');b.disabled=true;b.innerHTML='<span class="spin"></span>스캔 중 · ID 1~247';setTimeout(()=>{b.disabled=false;b.innerHTML='<svg class="ic"><use href="#i-scan"/></svg>Auto Scan';toast('스캔 완료 · 새 디바이스 없음','info')},2200)};
$('#addBtn').onclick=()=>toast('Add Device 창 (이름 · Slave ID · 운전 모드)','info');
$('#q').addEventListener('input',e=>{search=e.target.value.trim().toLowerCase();render(false)});   // 검색은 즉시. 애니메이션 없음

/* ---------- 토스트: 아래에서 들어오고, 나갈 땐 더 빠르게. 호버하면 멈추고, 옆으로 끌면 닫힌다 ---------- */
function toast(html,kind='',ms=3400,undo){const box=$('#toasts');while(box.children.length>=4)box.firstChild.remove();
  const el=document.createElement('div');el.className='toast '+kind;el.innerHTML=`<span class="dot"></span><span class="msg">${html}</span><button class="x" aria-label="닫기"><svg class="ic sm"><use href="#i-x"/></svg></button>`;box.appendChild(el);
  let rem=ms,t0=performance.now(),tm=setTimeout(close,ms),dead=false;
  function close(){if(dead)return;dead=true;clearTimeout(tm);el.classList.add('out');setTimeout(()=>el.remove(),160)}
  el.querySelector('.x').onclick=close;if(undo)el.querySelector('u')?.addEventListener('click',()=>{undo();close()});
  el.addEventListener('mouseenter',()=>{clearTimeout(tm);rem-=performance.now()-t0});el.addEventListener('mouseleave',()=>{t0=performance.now();tm=setTimeout(close,Math.max(600,rem))});
  let dr=null;el.addEventListener('pointerdown',e=>{if(e.target.closest('button,u'))return;dr={x:e.clientX,t:performance.now()};el.setPointerCapture(e.pointerId);el.classList.add('dragging')});
  el.addEventListener('pointermove',e=>{if(!dr)return;let dx=e.clientX-dr.x;if(dx<0)dx*=.2;el.style.transform=`translateX(${dx}px)`;dr.dx=dx});
  const up=()=>{if(!dr)return;const {dx=0,t}=dr;dr=null;el.classList.remove('dragging');const v=Math.abs(dx)/(performance.now()-t);el.style.transform='';if(dx>60||(dx>6&&v>.11))close()};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);return el}

/* ---------- 툴팁: 처음 400ms 지연, 하나가 열려 있으면 다음은 즉시 ---------- */
const tip=$('#tip');let tipT=0,tipLast=0,tipEl=null;
function showTip(el,instant){tip.innerHTML=el.dataset.tip.replace(/ · (Shift\+A|Esc|\/)$/,' <kbd>$1</kbd>');tip.classList.toggle('instant',instant);const r=el.getBoundingClientRect();tip.style.left='0';tip.style.top='0';const tw=tip.offsetWidth,th=tip.offsetHeight;
  const inRail=el.closest('.rail');let left=inRail?r.right+8:clamp(r.left+r.width/2-tw/2,8,innerWidth-tw-8),top=inRail?r.top+r.height/2-th/2:r.top-th-6;if(top<8){top=r.bottom+6;tip.style.transformOrigin='top center'}else tip.style.transformOrigin=inRail?'left center':'bottom center';
  tip.style.left=left+'px';tip.style.top=top+'px';tip.classList.add('on')}
function hideTip(){if(tip.classList.contains('on'))tipLast=performance.now();tip.classList.remove('on');clearTimeout(tipT);tipEl=null}
if(FINE.matches){
  document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el||el===tipEl||menu)return;tipEl=el;clearTimeout(tipT);const instant=performance.now()-tipLast<450;if(instant)showTip(el,true);else tipT=setTimeout(()=>showTip(el,false),400)});
  document.addEventListener('mouseout',e=>{const el=e.target.closest('[data-tip]');if(!el||el!==tipEl||(e.relatedTarget&&el.contains(e.relatedTarget)))return;hideTip()});
  document.addEventListener('pointerdown',()=>{clearTimeout(tipT);tip.classList.remove('on');tipEl=null},true);
}

/* ---------- 키보드: 자주 쓰는 동작은 애니메이션 없이 ---------- */
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(menu){closeMenu(true);return}if(document.activeElement===$('#q')||search){$('#q').blur();$('#q').value='';search='';render(false);return}if(sel.size){clearSel();return}}
  if(e.target.matches?.('input,select,textarea'))return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();$('#q').select()}
  if(e.key==='A'&&e.shiftKey){e.preventDefault();visible().filter(d=>d.st!=='new').forEach(d=>sel.add(d.id));syncSel()}
  if(e.key==='1')setView('grid');if(e.key==='2')setView('list');
});

/* ---------- 검토용 ---------- */
$('#dTheme').onclick=e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.v)};
$('#dMode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.v;segOn($('#dMode'),mode);clearSel();render(false)};segOn($('#dMode'),mode);
$('#dLayout').onclick=e=>{const b=e.target.closest('button');if(b)setLayout(b.dataset.v)};segOn($('#dLayout'),document.documentElement.dataset.layout);
$('#dState').onclick=e=>{const b=e.target.closest('button');if(!b)return;segOn($('#dState'),b.dataset.v);['stConnected','stDisconnected','stEmpty'].forEach(id=>$('#'+id).hidden=id!==b.dataset.v);
  const dis=b.dataset.v==='stDisconnected';const chip=$('#portChip');chip.classList.toggle('ok',!dis);chip.classList.toggle('off',dis);chip.innerHTML=dis?'<span class="dot"></span>연결 안 됨<svg class="ic sm"><use href="#i-down"/></svg>':'<span class="dot"></span><span class="mono">COM3</span>19200 · 8N1<svg class="ic sm"><use href="#i-down"/></svg>';
  $('#liveSwitch').classList.toggle('on',b.dataset.v==='stConnected');$('#topSub').textContent=b.dataset.v==='stConnected'?'6 devices · 5 online':dis?'포트 연결 필요':'0 devices · COM3';clearSel()};
if(q.get('state'))$(`#dState [data-v="${q.get('state')}"]`)?.click();

/* ---------- 시작 ---------- */
renderTabs();renderDock();render(true);firstPaint=false;
addEventListener('resize',()=>{placeTab(true);drawAll()});
if(q.get('view'))setView(q.get('view'));
if(q.get('sel')){devices.slice(0,+q.get('sel')).forEach(d=>sel.add(d.id));syncSel()}
if(q.get('menu')){$$('.card .menu-btn')[+q.get('menu')]?.click()}
</script>
</body>
</html>
