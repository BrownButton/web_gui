<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
body{margin:0;background:#0b111d;color:#e6edf7;font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:#4f8df7}a:hover{color:#7fb0ff}
*{box-sizing:border-box}
.mono{font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-variant-numeric:tabular-nums}
.app{width:1440px;height:900px;display:grid;grid-template-columns:66px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);overflow:hidden;background:#0b111d}
.rail{grid-row:1/3;background:#0e1626;border-right:1px solid #1c2740;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail-logo{width:46px;height:34px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.rail-logo img{height:18px;width:auto}
.rail-item{width:50px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8a9bb5;font-size:9.5px;letter-spacing:.02em}
.rail-item.active{background:#182742;color:#e6edf7}
.rail-item.active svg{stroke:#4f8df7}
.rail-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail-sep{width:30px;height:1px;background:#1c2740;margin:6px 0}
.rail-spacer{flex:1}
.topbar{grid-column:2;display:flex;align-items:center;gap:12px;padding:0 20px;background:#0e1626;border-bottom:1px solid #1c2740}
.topbar .title{font-weight:600;font-size:14px;letter-spacing:.01em}
.topbar .sub{color:#8a9bb5;font-size:12px}
.topbar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;border:1px solid #22304a;background:#111a2b;font-size:12px;color:#c9d4e5;white-space:nowrap}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip.ok{border-color:#1f5a3c;color:#7fe2a8;background:#0f2a1c}
.chip.warn{border-color:#5a4416;color:#f5c862;background:#2a2110}
.chip.err{border-color:#6b1f33;color:#ff8aa3;background:#2d1119}
.chip.off{border-style:dashed;border-color:#3a4a68;color:#8a9bb5;background:transparent}
.chip.info{border-color:#1f3d6b;color:#8fb8ff;background:#0f1f3a}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid #2a3a58;background:#172236;color:#e6edf7;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:#2f6fe0;border-color:#2f6fe0;color:#fff}
.btn.danger{background:#3a1522;border-color:#7a2340;color:#ff8aa3}
.btn.ghost{background:transparent;border-color:transparent;color:#8a9bb5}
.btn.sm{height:24px;padding:0 8px;font-size:11px}
.seg{display:inline-flex;border:1px solid #2a3a58;border-radius:6px;overflow:hidden;height:26px}
.seg span{padding:0 10px;display:flex;align-items:center;font-size:11.5px;color:#8a9bb5}
.seg span.on{background:#2f6fe0;color:#fff}
.card{background:#111a2b;border:1px solid #1e2b45;border-radius:10px}
.input{height:28px;border:1px solid #2a3a58;background:#0b111d;border-radius:6px;color:#e6edf7;padding:0 8px;display:flex;align-items:center;font-size:12px}
.label{font-size:11px;color:#8a9bb5;text-transform:uppercase;letter-spacing:.06em}
.content{grid-column:2;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.03em}
.badge.m{background:#1b3358;color:#8fb8ff}
.badge.s{background:#173a3a;color:#6fe0d6}
.badge.u{background:#2a2a33;color:#a3a9b8;border:1px dashed #4a5166}
.badge.id{background:#1a2438;color:#c9d4e5;font-family:'IBM Plex Mono',Consolas,monospace;font-weight:500}
.badge.role{background:#3a2a10;color:#f5c862}
.badge.cap{background:#2a2a33;color:#8a92a6}
.tabs{display:flex;gap:2px;border-bottom:1px solid #1e2b45}
.tab{padding:10px 14px;font-size:12.5px;color:#8a9bb5;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.tab.on{color:#e6edf7;border-bottom-color:#4f8df7}
.kv{display:flex;justify-content:space-between;font-size:11.5px;color:#8a9bb5}
.kv b{color:#c9d4e5;font-weight:500}
.toggle{width:34px;height:18px;border-radius:9px;background:#2a3a58;position:relative;display:inline-block}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#8a9bb5}
.toggle.on{background:#2fd27a}
.toggle.on::after{left:18px;background:#0b111d}
body{background:#f7f7f4;color:#333;font-family:"Segoe Print","Comic Sans MS","Bradley Hand",cursive,sans-serif}
.w{width:1440px;height:900px;display:grid;overflow:hidden;background:#f7f7f4}
.bx{border:2px solid #444;border-radius:6px;background:#fff;display:flex;flex-direction:column;gap:8px;padding:10px}
.bx.g{background:#ececea}
.t{font-weight:700;font-size:14px}
.s{font-size:12px;color:#666}
.ln{height:8px;background:#ddd;border-radius:4px}
.ph{background:repeating-linear-gradient(135deg,#eee,#eee 6px,#f7f7f4 6px,#f7f7f4 12px);border:2px dashed #999;border-radius:6px}
.tag{display:inline-block;border:2px solid #444;border-radius:12px;padding:1px 8px;font-size:11px;background:#fff}
.hl{background:#fff3a3;padding:0 3px}
  </style>
</helmet>
<div class="w" style="grid-template-columns:200px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)">
  <div class="bx g" style="grid-row:1/3;border-radius:0;gap:6px">
    <span class="t">LS · FanCM</span>
    <span class="tag" style="align-self:flex-start">● COM3 connected</span>
    <span class="s">Text sidebar, like today</span>
    <div class="ln" style="width:70%;background:#444;height:12px"></div>
    <div class="ln" style="width:60%"></div><div class="ln" style="width:65%"></div><div class="ln" style="width:55%"></div>
    <div style="flex:1"></div>
    <span class="s">Engineer ▸ Terminal, Manufacture</span>
    <div class="ln" style="width:60%"></div><div class="ln" style="width:50%"></div>
    <span class="s">Settings</span>
  </div>
  <div class="bx g" style="border-radius:0;flex-direction:row;align-items:center"><span class="t">Dashboard</span><span style="flex:1"></span><span class="tag">REQ · OK · ERR</span><span class="tag">Light theme</span><span class="tag">Role: User</span></div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0">
    <div style="display:flex;gap:8px"><span class="tag">All</span><span class="tag">EC-FAN M</span><span class="tag">EC-FAN S</span><span style="flex:1"></span><span class="tag">Scan</span><span class="tag">+ Add</span></div>
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px">
      <div class="bx" style="height:170px"><span class="t">Supply Fan 1 <span class="tag">M</span></span><div class="ln" style="width:40%"></div><span style="font-size:26px;font-weight:700">1 245 RPM</span><div class="ln"></div><div class="ln" style="width:60%"></div></div>
      <div class="bx" style="height:170px"><span class="t">Supply Fan 2 <span class="tag">M</span></span><div class="ln" style="width:40%"></div><span style="font-size:26px;font-weight:700">1 248 RPM</span><div class="ln"></div><div class="ln" style="width:60%"></div></div>
      <div class="bx" style="height:170px"><span class="t">Roof Fan A <span class="tag">S</span></span><div class="ln" style="width:40%"></div><span style="font-size:26px;font-weight:700">62.5 %</span><div class="ln"></div><div class="ln" style="width:60%"></div></div>
    </div>
    <div class="ph" style="height:150px;display:flex;align-items:center;justify-content:center"><span class="s">more cards…</span></div>
    <div style="flex:1"></div>
    <div class="bx" style="flex-direction:row;align-items:center;background:#fff3a3"><span class="t">2 selected</span><span class="tag">RPM / %</span><span class="tag">0 25 50 75 100</span><span class="tag">Apply</span><span class="tag">Stop</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
